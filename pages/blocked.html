<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#0B7A5E">

    <title>Blocked by AdShield</title>

    <style>
        :root {
            color-scheme: light dark;

            --bg: #EEF1F5;
            --card: #FFFFFF;
            --ink: #0E1A2B;
            --muted: #5A687A;
            --primary: #0B7A5E;
            --border: #E1E7EF;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #0E1622;
                --card: #172334;
                --ink: #E8EEF6;
                --muted: #93A1B5;
                --primary: #34C79D;
                --border: #29394D;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: grid;
            place-items: center;

            padding: 20px;

            background: var(--bg);
            color: var(--ink);

            font-family:
                system-ui,
                "Segoe UI",
                "Noto Sans Bengali",
                sans-serif;
        }

        main {
            width: 100%;
            max-width: 440px;

            padding: 40px 32px;

            text-align: center;

            background: var(--card);

            border: 1px solid var(--border);

            border-radius: 18px;

            box-shadow:
                0 12px 40px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 22px;

            display: grid;
            place-items: center;

            border-radius: 22px;

            background: var(--primary);
            color: #FFFFFF;

            font-size: 38px;
            font-weight: 800;
        }

        .brand {
            font-size: 14px;
            font-weight: 700;

            letter-spacing: 2px;

            color: var(--primary);

            margin-bottom: 18px;
        }

        h1 {
            font-size: 26px;

            margin: 0 0 12px;

            letter-spacing: -0.5px;
        }

        p {
            color: var(--muted);

            font-size: 15px;
            line-height: 1.7;

            margin: 0 0 26px;
        }

        .status {
            display: inline-flex;
            align-items: center;

            gap: 8px;

            padding: 8px 14px;

            margin-bottom: 24px;

            border-radius: 30px;

            background: rgba(11, 122, 94, 0.10);

            color: var(--primary);

            font-size: 13px;
            font-weight: 700;
        }

        .status-dot {
            width: 8px;
            height: 8px;

            border-radius: 50%;

            background: var(--primary);
        }

        .actions {
            display: flex;
            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;
        }

        button {
            font: inherit;
            font-size: 14px;
            font-weight: 700;

            padding: 11px 22px;

            border-radius: 9px;

            border: 2px solid var(--primary);

            background: transparent;
            color: var(--primary);

            cursor: pointer;

            transition: 0.2s ease;
        }

        button:hover {
            background: var(--primary);
            color: #FFFFFF;
        }

        button:focus-visible {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
        }

        .footer {
            margin-top: 30px;

            padding-top: 18px;

            border-top: 1px solid var(--border);

            font-size: 12px;
            color: var(--muted);
        }

        @media (max-width: 420px) {
            main {
                padding: 32px 22px;
            }

            h1 {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

<main>

    <div class="logo" aria-hidden="true">
        A
    </div>

    <div class="brand">
        ADSHIELD
    </div>

    <div class="status">
        <span class="status-dot"></span>
        PROTECTION ACTIVE
    </div>

    <h1>Page Blocked!</h1>

    <p>
        AdShield prevented this page from opening because
        its address matches a configured advertising,
        redirect, or blocked domain rule.
    </p>

    <div class="actions">

        <button id="back" type="button">
            ← Go Back
        </button>

    </div>

    <div class="footer">
        Protected by AdShield · Browse Safely
    </div>

</main>

<script src="blocked.js"></script>

</body>
</html>
